<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Կծուծիծակի Տեքստային Անիմացիա</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom, #1a0000, #330000, #660000);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .main-title {
            font-size: 80px;
            font-weight: 900;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .letter {
            display: inline-block;
            animation: letterBounce 0.6s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8),
                        0 0 40px rgba(255, 107, 107, 0.5);
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.5));
        }

        .letter:nth-child(1) { animation-delay: 0s; color: #ff6b6b; }
        .letter:nth-child(2) { animation-delay: 0.1s; color: #ff5252; }
        .letter:nth-child(3) { animation-delay: 0.2s; color: #ee5a3f; }
        .letter:nth-child(4) { animation-delay: 0.3s; color: #ff4444; }
        .letter:nth-child(5) { animation-delay: 0.4s; color: #ff6b6b; }
        .letter:nth-child(6) { animation-delay: 0.5s; color: #c92a2a; }

        @keyframes letterBounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-30px) scale(1.1);
            }
        }

        .subtitle {
            font-size: 32px;
            margin: 30px 0;
            color: #ffe66d;
            font-weight: bold;
            animation: glow 2s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(255, 230, 109, 0.8);
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(255, 230, 109, 0.8);
                transform: scale(1);
            }
            50% {
                text-shadow: 0 0 40px rgba(255, 230, 109, 1),
                            0 0 60px rgba(255, 107, 107, 0.6);
                transform: scale(1.05);
            }
        }

        .emoji-wave {
            font-size: 120px;
            margin: 40px 0;
            animation: wave 1s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.8));
        }

        @keyframes wave {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(-15deg) scale(1.1);
            }
        }

        .tagline-container {
            margin: 40px 0;
            font-size: 24px;
            line-height: 1.8;
        }

        .tagline {
            display: inline-block;
            margin: 10px 0;
            animation: slideInText 1s ease-out;
        }

        .tagline-1 { animation-delay: 0.5s; }
        .tagline-2 { animation-delay: 1s; }
        .tagline-3 { animation-delay: 1.5s; }

        @keyframes slideInText {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 50px auto;
            max-width: 600px;
            z-index: 10;
        }

        .benefit-card {
            background: rgba(255, 107, 107, 0.2);
            border: 2px solid rgba(255, 107, 107, 0.5);
            border-radius: 15px;
            padding: 20px;
            animation: cardFloat 3s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .benefit-card:hover {
            background: rgba(255, 107, 107, 0.4);
            border-color: rgba(255, 107, 107, 0.8);
            transform: translateY(-10px);
        }

        .benefit-card:nth-child(1) { animation-delay: 0s; }
        .benefit-card:nth-child(2) { animation-delay: 0.5s; }
        .benefit-card:nth-child(3) { animation-delay: 1s; }
        .benefit-card:nth-child(4) { animation-delay: 1.5s; }

        @keyframes cardFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .benefit-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .benefit-text {
            font-size: 16px;
            font-weight: bold;
        }

        .cta-section {
            margin-top: 50px;
            animation: fadeInUp 1s ease-out 2s backwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cta-button {
            background: linear-gradient(135deg, #ff6b6b, #ee5a3f);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .cta-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
        }

        .cta-button:active {
            transform: translateY(-2px) scale(1);
        }

        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }

        .particle-text {
            position: absolute;
            font-size: 50px;
            opacity: 0.3;
            animation: particleFloat 8s ease-in infinite;
            pointer-events: none;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 50px 0;
            font-size: 20px;
            animation: slideUp 1s ease-out 1.5s backwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 40px;
            font-weight: bold;
            color: #ffe66d;
            animation: countUp 2s ease-out;
        }

        @keyframes countUp {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="main-title">
            <span class="letter">Կ</span>
            <span class="letter">Ա</span>
            <span class="letter">Ր</span>
            <span class="letter">Մ</span>
            <span class="letter">Ի</span>
            <span class="letter">Ր</span>
        </div>

        <div class="emoji-wave">🌶️</div>

        <div class="subtitle">Մեկ կծուց - հազար համեղ ճաշ</div>

        <div class="tagline-container">
            <div class="tagline tagline-1">🔥 Բնական և Օգտակար 🔥</div>
            <div class="tagline tagline-2">💪 Հաստիք ու Առողջություն 💪</div>
            <div class="tagline tagline-3">❤️ Հայկական Ավանդություն ❤️</div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="stat1">100%</div>
                <div>Բնական</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="stat2">+150</div>
                <div>Վիտամին</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="stat3">∞</div>
                <div>Համեղություն</div>
            </div>
        </div>

        <div class="benefits-grid">
            <div class="benefit-card">
                <div class="benefit-icon">✨</div>
                <div class="benefit-text">Վիտամին C</div>
            </div>
            <div class="benefit-card">
                <div class="benefit-icon">💪</div>
                <div class="benefit-text">Իմունիտետ</div>
            </div>
            <div class="benefit-card">
                <div class="benefit-icon">🔥</div>
                <div class="benefit-text">Մետաբոլիզմ</div>
            </div>
            <div class="benefit-card">
                <div class="benefit-icon">❤️</div>
                <div class="benefit-text">Սիրտ Առողջ</div>
            </div>
        </div>

        <div class="cta-section">
            <button class="cta-button">Պատվիրել Հիմա</button>
            <button class="cta-button" style="background: linear-gradient(135deg, #c92a2a, #ee5a3f);">Ավելին Իմանալ</button>
        </div>
    </div>

    <script>
        // Create floating text particles
        const particlesContainer = document.getElementById('particles');

        for (let i = 0; i < 15; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle-text';
            particle.textContent = '🌶️';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 3 + 's';
            particle.style.animationDuration = (5 + Math.random() * 4) + 's';
            particlesContainer.appendChild(particle);
        }

        // Animate stats on scroll or load
        function animateStat(element, value) {
            if (value === '∞') {
                element.textContent = '∞';
                return;
            }
            
            const numValue = parseInt(value);
            let current = 0;
            const increment = numValue / 50;
            
            const timer = setInterval(() => {
                current += increment;
                if (current >= numValue) {
                    element.textContent = value;
                    clearInterval(timer);
                } else {
                    element.textContent = Math.floor(current) + value.replace(/\d/g, '');
                }
            }, 30);
        }

        // Trigger animations after delay
        setTimeout(() => {
            animateStat(document.getElementById('stat1'), '100%');
            animateStat(document.getElementById('stat2'), '+150');
            animateStat(document.getElementById('stat3'), '∞');
        }, 1000);

        // Button interactions
        document.querySelectorAll('.cta-button').forEach(btn => {
            btn.addEventListener('click', function() {
                const text = this.textContent;
                alert(`🔥 ${text} - Շնորհակալություն! 🔥\n\nՀաստիք և բաժնել ընկերներին!`);
            });
        });
    </script>
</body>
</html>
